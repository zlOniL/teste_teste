<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>{% block title %}Painel administrativo{% endblock %} | PL Serra</title>
<style>
:root{--blue:#075ba8;--navy:#073764;--green:#00a54f;--yellow:#fdd303;--text:#153754;--muted:#6b7f91;--surface:#f2f6fa;--line:#dce7ef}
*{box-sizing:border-box}body{font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--surface);margin:0}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.topline{height:7px;background:linear-gradient(90deg,var(--blue) 0 65%,var(--yellow) 65% 84%,var(--green) 84%)}
.topbar{background:#fff;border-bottom:1px solid var(--line)}.topbar-inner{max-width:1170px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px}.top-brand{display:flex;gap:13px;align-items:center;color:var(--navy);font-size:19px;font-weight:850;text-decoration:none!important;letter-spacing:-.02em}.top-brand img{height:50px;width:50px;object-fit:cover;border-radius:10px}.top-brand span small{display:block;font-size:10px;letter-spacing:.15em;color:#6d8298;margin-top:3px}.top-links{display:flex;gap:13px;align-items:center}.top-links a{font-weight:700;font-size:13px}.top-links button{background:transparent;border:0;color:#61768b;cursor:pointer;font:inherit;font-weight:750}
main{max-width:1170px;margin:46px auto 80px;padding:0 24px}h1{font-size:clamp(29px,3.1vw,42px);letter-spacing:-.045em;line-height:1.14;margin:0 0 9px}h2{font-size:21px;letter-spacing:-.025em;margin:0 0 20px}h3{font-size:17px;margin:0}.muted{color:var(--muted)}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:#078b53}.subtitle{color:var(--muted);line-height:1.6;margin:0 0 35px}
.panel{background:white;border-radius:18px;border:1px solid #dce7f0;box-shadow:0 10px 36px rgba(16,60,101,.055);padding:26px;margin-bottom:26px}.columns{display:grid;grid-template-columns:1.25fr .75fr;gap:24px}.admin-table{width:100%;border-collapse:collapse}.admin-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#74879a;padding:14px 12px;border-bottom:1px solid var(--line)}.admin-table td{padding:15px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}.admin-table tr:last-child td{border-bottom:0}.admin-table .headline{font-weight:850;color:var(--navy);font-size:14px}.admin-table small{display:block;color:var(--muted);margin-top:5px}.admin-actions{display:flex;gap:12px;align-items:center}.admin-actions button{background:none;border:0;color:#b64e4e;font-weight:750;font-size:12px;cursor:pointer;padding:0}
.badge{padding:6px 10px;border-radius:9px;font-size:11px;font-weight:850;display:inline-block}.badge.published{background:#e2f7e9;color:#16804d}.badge.draft{background:#fff3d7;color:#876000}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;background:var(--blue);border-radius:11px;padding:12px 18px;color:white!important;font:inherit;font-weight:800;font-size:13px;text-decoration:none!important;cursor:pointer}.btn:hover{background:#034881}.btn.green{background:#00864b}.btn.outline{background:#eaf3fa;color:var(--navy)!important}.btn.full{width:100%}
.field{margin-bottom:18px}.field label{display:block;font-weight:750;font-size:13px;color:#294966;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:12px 14px;border:1px solid #cedde8;border-radius:10px;background:#fff;font:inherit;font-size:14px;color:#163958;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #dcedff}.field textarea{resize:vertical;line-height:1.58;min-height:115px}.field textarea.large{min-height:300px}.field .hint{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.5}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.notice{border-radius:12px;background:#e3f7e8;border:1px solid #9dd4aa;color:#15633c;padding:13px 16px;font-size:13px;margin-bottom:22px}.error{background:#fff0ed;border-color:#efb8aa;color:#a33f2d}.panel-heading{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:15px}.panel-heading h2{margin:0}.editor{max-width:870px;margin:auto}.login-page{max-width:410px;margin:45px auto}.login-page .panel{padding:30px}.login-page h1{font-size:30px}.login-page .subtitle{margin-bottom:23px}.login-motif{height:9px;background:linear-gradient(90deg,#075ba8 0 61%,#fdd303 61% 82%,#00a54f 82%);border-radius:5px;margin:0 0 22px}
@media(max-width:900px){.columns{grid-template-columns:1fr}.admin-table{display:block;overflow-x:auto}}@media(max-width:600px){main{padding:0 16px;margin:28px auto}.topbar-inner{padding:13px 16px}.top-brand{font-size:15px}.top-brand img{width:39px;height:39px}.top-links{gap:8px}.top-links a,.top-links button{font-size:12px}.panel{padding:20px 16px}.field-row{grid-template-columns:1fr}.admin-table th,.admin-table td{padding:9px}.admin-actions{flex-wrap:wrap}}
</style></head><body><div class="topline"></div><header class="topbar"><div class="topbar-inner"><a class="top-brand" href="/"><img src="/assets/logo.jpg" alt="Logo Partido Liberal"><span>PL SERRA<small>ÁREA ADMINISTRATIVA</small></span></a><div class="top-links"><a href="/">Ver o site ↗</a>{% if admin %}<form method="post" action="/admin/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit">Sair</button></form>{% endif %}</div></div></header>
<main>{% block content %}{% endblock %}</main></body></html>
